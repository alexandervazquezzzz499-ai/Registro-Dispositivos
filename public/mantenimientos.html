<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial de Mantenimientos</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
  <div class="app-container">
    <div class="header">
      <h1>
        <span class="title-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
        </span>
        Historial General de Mantenimientos
      </h1>
      <div class="user-area">
        <button class="btn-secondary" onclick="window.location.href='/'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          Volver al Inventario
        </button>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchMantenimiento" placeholder="Buscar por falla, solución o técnico...">
      </div>
      
      <div class="filter-group">
        <select id="filterMarca">
          <option value="">Todas las marcas</option>
        </select>
        <button class="btn-secondary" id="exportMonthlyPdfBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
          Reporte Mensual
        </button>
        <button class="btn-danger" id="deleteSelectedHistoryBtn" style="display: none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          Eliminar Seleccionados
        </button>
      </div>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th style="width: 40px;"><input type="checkbox" id="selectAllHistory"></th>
            <th>FECHA</th>
            <th>EQUIPO</th>
            <th>MARCA</th>
            <th>TIPO</th>
            <th>FALLA / COMPONENTE</th>
            <th>SOLUCIÓN APLICADA</th>
            <th>TÉCNICO</th>
          </tr>
        </thead>
        <tbody id="maintenanceTableBody"></tbody>
      </table>
      <div id="emptyMantenimiento" class="empty-state" style="display:none;">
        <h3>No hay mantenimientos registrados</h3>
        <p>Los mantenimientos aparecerán aquí cuando se reporten.</p>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Cargando...</div>
  <script src="mantenimientos.js?v=10"></script>
</body>
</html>
