<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial de Mantenimientos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <div class="header">
      <h1><span>🛠️</span> Historial General de Mantenimientos</h1>
      <div class="user-area">
        <button class="btn-primary" onclick="window.location.href='/'" style="background:#64748b; box-shadow:none;">⬅️ Volver al Inventario</button>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" style="margin-right: 8px;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchMantenimiento" placeholder="Buscar por falla, solución o técnico...">
      </div>
      
      <div class="filter-group">
        <select id="filterMarca">
          <option value="">Todas las marcas</option>
        </select>
      </div>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>FECHA</th>
            <th>EQUIPO</th>
            <th>MARCA</th>
            <th>FALLA REPORTADA</th>
            <th>SOLUCIÓN APLICADA</th>
            <th>TÉCNICO</th>
          </tr>
        </thead>
        <tbody id="maintenanceTableBody"></tbody>
      </table>
      <div id="emptyMantenimiento" class="empty-state" style="display:none;">
        <h3>No hay mantenimientos registrados.</h3>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Cargando...</div>
  <script src="mantenimientos.js"></script>
</body>
</html>
