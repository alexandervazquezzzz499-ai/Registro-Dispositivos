<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Registro de Dispositivos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1e2b3c 0%, #2a6df4 100%); padding: 1.5rem; }
    .login-card { background: white; border-radius: 28px; padding: 2.8rem 2.4rem; max-width: 420px; width: 100%; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3); animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .login-icon { width: 70px; height: 70px; background: #eef4ff; border-radius: 22px; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 1.2rem; }
    h1 { text-align: center; color: #1e2b3c; font-size: 1.6rem; margin-bottom: 0.4rem; }
    .subtitle { text-align: center; color: #8f9eb2; font-size: 0.9rem; margin-bottom: 2rem; }
    .form-group { margin-bottom: 1.2rem; }
    label { display: block; margin-bottom: 6px; color: #4a5b6e; font-weight: 500; font-size: 0.9rem; }
    input { width: 100%; padding: 0.95rem 1.2rem; border: 1.5px solid #e2e8f0; border-radius: 16px; font-size: 1rem; outline: none; transition: 0.2s; background: #fbfdff; color: #1e2b3c; }
    input:focus { border-color: #2a6df4; box-shadow: 0 0 0 4px rgba(42, 109, 244, 0.1); }
    button { width: 100%; padding: 1rem; background: #2a6df4; color: white; border: none; border-radius: 16px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 0.5rem; box-shadow: 0 8px 20px rgba(42, 109, 244, 0.3); }
    button:hover { background: #1a5ae0; transform: translateY(-2px); }
    button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .error { background: #ffe6e6; color: #c0392b; padding: 0.8rem 1rem; border-radius: 12px; font-size: 0.9rem; margin-bottom: 1rem; display: none; }
    .error.show { display: block; }
    .hint { text-align: center; margin-top: 1.5rem; font-size: 0.8rem; color: #8f9eb2; background: #f7f9fc; padding: 0.8rem; border-radius: 12px; }
    .hint strong { color: #2a6df4; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-icon">🔐</div>
    <h1>Iniciar sesión</h1>
    <p class="subtitle">Registro de Dispositivos</p>
    <div class="error" id="errorMsg"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" id="submitBtn">Ingresar</button>
    </form>
    <div class="hint">Credenciales por defecto:<br><strong>admin</strong> / <strong>admin123</strong></div>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');
    fetch('/api/session').then(r => r.json()).then(data => { if (data.autenticado) window.location.href = '/'; });
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('show');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Ingresando...';
      const usuario = document.getElementById('usuario').value.trim();
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ usuario, password }) });
        const data = await res.json();
        if (!res.ok) { errorMsg.textContent = data.error || 'Error al iniciar sesión'; errorMsg.classList.add('show'); submitBtn.disabled = false; submitBtn.textContent = 'Ingresar'; return; }
        window.location.href = '/';
      } catch (err) { errorMsg.textContent = 'Error de conexión con el servidor'; errorMsg.classList.add('show'); submitBtn.disabled = false; submitBtn.textContent = 'Ingresar'; }
    });
  </script>
</body>
</html>
