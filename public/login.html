<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Registro de Dispositivos</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #E8ECF1;
      background:
        radial-gradient(ellipse 900px 700px at 20% -10%, rgba(0, 224, 255, 0.09), transparent 60%),
        radial-gradient(ellipse 900px 700px at 100% 110%, rgba(168, 85, 247, 0.07), transparent 60%),
        linear-gradient(135deg, #0A0E1A 0%, #0D1424 50%, #131B2E 100%);
      -webkit-font-smoothing: antialiased;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 2.5rem 2.25rem;
      max-width: 400px;
      width: 100%;
      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.03) inset;
    }
    .login-icon {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #00E0FF 0%, #A855F7 100%);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      color: #0A0E1A;
      box-shadow: 0 0 30px rgba(0, 224, 255, 0.4);
    }
    h1 {
      text-align: center;
      color: #E8ECF1;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .subtitle {
      text-align: center;
      color: #5A6478;
      font-size: 0.6875rem;
      margin-bottom: 2rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 600;
    }
    .form-group { margin-bottom: 1rem; }
    label {
      display: block;
      margin-bottom: 6px;
      color: #8B96A8;
      font-weight: 600;
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    input {
      width: 100%;
      padding: 0.65rem 0.875rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      font-size: 0.9375rem;
      outline: none;
      transition: 0.2s;
      background: rgba(0, 0, 0, 0.25);
      color: #E8ECF1;
      font-family: 'Inter', sans-serif;
    }
    input:focus {
      border-color: #00E0FF;
      box-shadow: 0 0 0 3px rgba(0, 224, 255, 0.15);
      background: rgba(0, 0, 0, 0.35);
    }
    input::placeholder { color: #5A6478; }
    button {
      width: 100%;
      padding: 0.75rem;
      background: #00E0FF;
      color: #0A0E1A;
      border: 1px solid #00E0FF;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 0.75rem;
      font-family: 'Inter', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      box-shadow: 0 0 20px rgba(0, 224, 255, 0.3);
    }
    button:hover {
      background: #00F0FF;
      box-shadow: 0 0 30px rgba(0, 224, 255, 0.5);
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      background: rgba(244, 63, 94, 0.12);
      color: #F43F5E;
      padding: 0.65rem 0.875rem;
      border-radius: 4px;
      font-size: 0.8125rem;
      margin-bottom: 1rem;
      display: none;
      border: 1px solid rgba(244, 63, 94, 0.35);
    }
    .error.show { display: block; }
    .hint {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #5A6478;
      padding: 0.75rem;
      border: 1px dashed rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      line-height: 1.5;
    }
    .hint strong { color: #00E0FF; font-weight: 600; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
    </div>
    <h1>Iniciar sesión</h1>
    <p class="subtitle">Registro de Dispositivos</p>
    <div class="error" id="errorMsg"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" id="submitBtn">Ingresar</button>
    </form>
    <div class="hint">Credenciales por defecto:<br><strong>admin</strong> / <strong>admin123</strong></div>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');
    fetch('/api/session').then(r => r.json()).then(data => { if (data.autenticado) window.location.href = '/'; });
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('show');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Ingresando...';
      const usuario = document.getElementById('usuario').value.trim();
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ usuario, password }) });
        const data = await res.json();
        if (!res.ok) { errorMsg.textContent = data.error || 'Error al iniciar sesión'; errorMsg.classList.add('show'); submitBtn.disabled = false; submitBtn.textContent = 'Ingresar'; return; }
        window.location.href = '/';
      } catch (err) { errorMsg.textContent = 'Error de conexión con el servidor'; errorMsg.classList.add('show'); submitBtn.disabled = false; submitBtn.textContent = 'Ingresar'; }
    });
  </script>
</body>
</html>
